# Build the RunPod image on GitHub's runners (nothing is built or downloaded locally)
# and push it to ghcr.io/metatheoryinc/clm-hosted, once the tests pass.
name: image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, deploy/**, src/**, pyproject.toml, tests/**,
            .github/workflows/image.yml, .github/workflows/tests.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # the vLLM base image is ~9 GB unpacked; the stock runner has too little free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/metatheoryinc/clm-hosted:latest
            ghcr.io/metatheoryinc/clm-hosted:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
